<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senshi-Kan - Evaluador Cinemático Inteligente</title>
    
    <!-- Librerías de MediaPipe para Detección de Posturas Corporal -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Librería Face-api.js para Reconocimiento Facial Avanzado -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-bg: #121212;
            --color-surface: #1e1e1e;
            --color-primary: #ffcc00; /* Amarillo Mustard / Oro Senshi-Kan */
            --color-text: #ffffff;
            --color-error: #ff3333;
            --color-success: #00cc66;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--color-bg); color: var(--color-text);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Contenedor de Carga Biométrica */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 18, 18, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 60px; height: 60px; border: 6px solid #333;
            border-top: 6px solid var(--color-primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Panel de Configuración Inicial Seguro */
        #setup-panel {
            background-color: var(--surface); padding: 30px; border-radius: 12px;
            border: 2px solid var(--color-primary); width: 90%; max-width: 450px;
            margin-top: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: var(--color-surface);
        }
        h2 { color: var(--color-primary); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #bbb; font-size: 0.9rem; }
        input, select {
            width: 100%; padding: 12px; background-color: #2b2b2b; border: 1px solid #444;
            color: white; border-radius: 6px; font-size: 1rem;
        }
        
        .btn-principal {
            background-color: var(--color-primary); color: black; border: none;
            padding: 14px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 6px;
            cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-principal:hover { background-color: #e6b800; transform: translateY(-2px); }
        .btn-principal:disabled { background-color: #444; color: #777; cursor: not-allowed; transform: none; }

        /* Área de Evaluación Kinemática */
        #evaluacion-container {
            display: none; width: 100%; max-width: 1280px; padding: 20px;
            flex-direction: column; align-items: center;
        }
        #interface-layout { display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .video-box { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #333; background: #000; }
        video { transform: scaleX(-1); width: 640px; height: 480px; display: block; }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); width: 640px; height: 480px; }

        .dashboard { background-color: var(--color-surface); padding: 24px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 20px; }
        .metric-card { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid var(--color-primary); }
        .metric-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: white; margin-top: 5px; }

        .timer-retencion { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid var(--color-primary); text-align: center; }
        .timer-retencion span { color: var(--color-primary); font-weight: bold; font-size: 0.95rem; transition: all 0.2s ease; }
        .timer-retencion.en-rojo span { color: var(--color-error) !important; font-size: 1.7rem !important; }
    </style>
</head>
<body>

    <!-- Capa de Carga Informativa -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h3 id="loading-text">Iniciando Inteligencia Artificial Kinemática...</h3>
    </div>

    <!-- Formulario Inicial Blindado -->
    <div id="setup-panel">
        <h2>Control de Acceso</h2>
        
        <div style="width: 100%; height: 240px; background: #000; border-radius: 8px; margin-bottom: 15px; overflow: hidden; position: relative;">
            <video id="video-registro" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
        </div>

        <div class="form-group">
            <label>Atleta Identificado por Rostro:</label>
            <input type="text" id="input-name" placeholder="Párese frente a la cámara..." readonly style="border-color: #555; background: #1a1a1a;">
        </div>
        <div class="form-group">
            <label>Estatura Base (cm):</label>
            <input type="number" id="input-height" placeholder="Esperando reconocimiento..." readonly style="border-color: #555; background: #1a1a1a;">
        </div>
        <div class="form-group">
            <label>Posición de Karate a Evaluar:</label>
            <select id="select-kata">
                <option value="zenkutsu">Zenkutsu-Dachi (Posición Avanzada)</option>
                <option value="kokutsu">Kokutsu-Dachi (Posición Posterior)</option>
                <option value="kiba">Kiba-Dachi (Posición Jinete)</option>
            </select>
        </div>
        
        <button id="btn-iniciar" class="btn-principal" disabled>Iniciar Entrenamiento</button>
    </div>

    <!-- Contenedor Principal del Evaluador de Postura (BlazePose) -->
    <div id="evaluacion-container">
        <h1 style="color: var(--color-primary); margin-bottom: 20px; text-transform: uppercase;">Senshi-Kan CAR Smer Verdín</h1>
        <div id="interface-layout">
            
            <div class="video-box">
                <video id="video-evaluacion" playsinline></video>
                <canvas id="output-canvas"></canvas>
            </div>

            <div class="dashboard">
                <div class="metric-card">
                    <div class="metric-title">Atleta Activo</div>
                    <div id="display-atleta" class="metric-value" style="font-size: 1.4rem; color: var(--color-primary);">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Ángulo de Flexión de Rodilla</div>
                    <div id="display-angulo" class="metric-value">0°</div>
                </div>
                <div id="card-timer" class="timer-retencion">
                    <div class="metric-title">Estabilidad (5 Segundos)</div>
                    <span id="display-timer">0.0s</span>
                </div>
                <div class="metric-card" style="border-left-color: var(--color-success);">
                    <div class="metric-title">Estatus Técnico</div>
                    <div id="display-estatus" class="metric-value" style="font-size: 1.3rem; color: var(--color-success);">Ajustando Posición</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN CENTRALIZADA SEGURA
        // =========================================================================
        const URL_API_SHEETS = "https://script.google.com/macros/s/AKfycbz5BJRpDzcxGdelQVbvTsBKd_HrGhELQTqkr_4-Jjg8h_IAPnFhYmSRCjvJyvjrs3cE8g/exec"; 
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

        let baseDatosAlumnos = [];
        let faceMatcher = null;
        let streamCamaraActiva = null;

        const DOM = {
            loadingOverlay: document.getElementById('loading-overlay'),
            loadingText: document.getElementById('loading-text'),
            setupPanel: document.getElementById('setup-panel'),
            evalContainer: document.getElementById('evaluacion-container'),
            videoReg: document.getElementById('video-registro'),
            videoEval: document.getElementById('video-evaluacion'),
            canvas: document.getElementById('output-canvas'),
            btnIniciar: document.getElementById('btn-iniciar'),
            inputName: document.getElementById('input-name'),
            inputHeight: document.getElementById('input-height'),
            selectKata: document.getElementById('select-kata'),
            cardTimer: document.getElementById('card-timer'),
            displayAtleta: document.getElementById('display-atleta'),
            displayAngulo: document.getElementById('display-angulo'),
            displayTimer: document.getElementById('display-timer'),
            displayEstatus: document.getElementById('display-estatus')
        };
        const ctx = DOM.canvas.getContext('2d');

        let conteoEstabilidad = 0;
        let flagPosturaCorrecta = false;
        let lastTimestamp = performance.now();

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'es-MX';
                window.speechSynthesis.speak(u);
            }
        }

        // =========================================================================
        // FASE I: INICIALIZACIÓN AUTOMÁTICA Y EXTRACCIÓN PROTEGIDA
        // =========================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Cargar Redes Neuronales
                DOM.loadingText.innerText = "Cargando Redes Neuronales de Rostro...";
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                // 2. Descargar Alumnos validados desde Sheets (Solo Estatus = TRUE)
                DOM.loadingText.innerText = "Sincronizando Alumnos Autorizados...";
                const response = await fetch(URL_API_SHEETS);
                baseDatosAlumnos = await response.json();

                // 3. Procesar huellas faltantes de forma segura desde las fotos autorizadas
                await procesarHuellasDesdeDriveMasivo();

                // 4. Construir validador biométrico
                configurarComparadorRostros();

                DOM.loadingOverlay.style.display = 'none';
                activarCamaraAcreditacion();

            } catch (error) {
                console.error("Error crítico de inicio:", error);
                DOM.loadingText.innerText = "Error de comunicación con la base de datos central.";
            }
        });

        // RE-DIRECCIONAMIENTO DIRECTO A GOOGLE DRIVE PARA EVITAR BLOQUEOS DE APPSHEET
        async function procesarHuellasDesdeDriveMasivo() {
            for (let i = 0; i < baseDatosAlumnos.length; i++) {
                let alumno = baseDatosAlumnos[i];
                
                // Si la base de datos administrativa ya tiene foto pero no tiene huella calculada
                if (alumno.Foto && !alumno.Huella_Facial) {
                    DOM.loadingText.innerText = `Generando Firma Biométrica de: ${alumno.Nombre}...`;
                    
                    try {
                        // Rompemos el bloqueo de AppSheet leyendo directamente el archivo binario desde Google Drive
                        // Pasamos el parámetro ?image codificado directamente a su Apps Script para procesamiento nativo seguro
                        const proxyUrl = `${URL_API_SHEETS}?image=${encodeURIComponent(alumno.Foto)}`;
                        
                        const img = await faceapi.fetchImage(proxyUrl);
                        const deteccion = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                            .withFaceLandmarks()
                            .withFaceDescriptor();

                        if (deteccion) {
                            const stringHuella = JSON.stringify(Array.from(deteccion.descriptor));
                            
                            // Guardamos la firma de forma silenciosa e irreversible en Google Sheets
                            await fetch(URL_API_SHEETS, {
                                method: 'POST',
                                body: JSON.stringify({
                                    nombre: alumno.Nombre,
                                    huella: stringHuella,
                                    hash: alumno.Foto
                                })
                            });

                            baseDatosAlumnos[i].Huella_Facial = stringHuella;
                            baseDatosAlumnos[i].Hash_Foto = alumno.Foto;
                        }
                    } catch (e) {
                        console.warn(`No se pudo extraer la huella de la foto de ${alumno.Nombre}. Verifique el archivo en su Drive.`, e);
                    }
                }
            }
        }

        function configurarComparadorRostros() {
            const descriptoresRegistrados = [];
            baseDatosAlumnos.forEach(alumno => {
                if (alumno.Huella_Facial) {
                    const floatArray = new Float32Array(JSON.parse(alumno.Huella_Facial));
                    descriptoresRegistrados.push(new faceapi.LabeledFaceDescriptors(alumno.Nombre, [floatArray]));
                }
            });
            if (descriptoresRegistrados.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(descriptoresRegistrados, 0.55);
            }
        }

        // CONTROL BIOMÉTRICO EN VIVO ENTRADA (CERO CONTROLES MANUALES)
        async function activarCamaraAcreditacion() {
            try {
                streamCamaraActiva = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                DOM.videoReg.srcObject = streamCamaraActiva;
                
                async function escanearFrameRostro() {
                    if (DOM.setupPanel.style.display === 'none') return;

                    const deteccion = await faceapi.detectSingleFace(DOM.videoReg, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks()
                        .withFaceDescriptor();

                    if (deteccion && faceMatcher) {
                        const match = faceMatcher.findBestMatch(deteccion.descriptor);
                        
                        if (match.label !== 'unknown') {
                            const datosAtleta = baseDatosAlumnos.find(a => a.Nombre === match.label);
                            if (datosAtleta) {
                                DOM.inputName.value = datosAtleta.Nombre;
                                DOM.inputHeight.value = datosAtleta.Estatura_cm || "";
                                DOM.btnIniciar.disabled = false; // Desbloquea acceso de entrenamiento solo al ser verificado

                                hablar(`Pase autorizado. Hola ${datosAtleta.Nombre.split(' ')[0]}.`);
                                return; 
                            }
                        }
                    }
                    
                    // Si no reconoce a nadie o es un rostro desconocido, mantiene los inputs vacíos y el botón bloqueado
                    DOM.inputName.value = "";
                    DOM.inputHeight.value = "";
                    DOM.btnIniciar.disabled = true;

                    setTimeout(escanearFrameRostro, 400);
                }
                escanearFrameRostro();
            } catch (err) {
                console.error("Error al encender cámara de acreditación:", err);
            }
        }

        // =========================================================================
        // FASE II: CONFIGURACIÓN E INICIO DE EVALUACIÓN DE KARATE
        // =========================================================================
        DOM.btnIniciar.addEventListener('click', () => {
            if (streamCamaraActiva) {
                streamCamaraActiva.getTracks().forEach(track => track.stop());
            }

            DOM.setupPanel.style.display = 'none';
            DOM.evalContainer.style.display = 'flex';
            DOM.displayAtleta.innerText = DOM.inputName.value;

            iniciarMotorEvaluacionKarate();
        });

        function iniciarMotorEvaluacionKarate() {
            const pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false,
                minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
            });

            pose.onResults(procesarResultadosKinematicos);

            const camaraEval = new Camera(DOM.videoEval, {
                onFrame: async () => { await pose.send({ image: DOM.videoEval }); },
                width: 640, height: 480
            });
            camaraEval.start();
        }

        function calcularAngulo(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs((radians * 180.0) / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return angle;
        }

        // =========================================================================
        // FASE III: PROCESAMIENTO DINÁMICO DE POSTURAS
        // =========================================================================
        function procesarResultadosKinematicos(results) {
            ctx.clearRect(0, 0, DOM.canvas.width, DOM.canvas.height);
            ctx.drawImage(results.image, 0, 0, DOM.canvas.width, DOM.canvas.height);

            if (!results.poseLandmarks) {
                DOM.displayEstatus.innerText = "Atleta fuera de rango";
                return;
            }

            const nodos = results.poseLandmarks;
            const caderaIzq = nodos[23];
            const rodillaIzq = nodos[25];
            const tobilloIzq = nodos[27];

            const anguloRodilla = Math.round(calcularAngulo(caderaIzq, rodillaIzq, tobilloIzq));
            DOM.displayAngulo.innerText = `${anguloRodilla}°`;

            ctx.beginPath();
            ctx.moveTo(caderaIzq.x * DOM.canvas.width, caderaIzq.y * DOM.canvas.height);
            ctx.lineTo(rodillaIzq.x * DOM.canvas.width, rodillaIzq.y * DOM.canvas.height);
            ctx.lineTo(tobilloIzq.x * DOM.canvas.width, tobilloIzq.y * DOM.canvas.height);
            ctx.strokeStyle = "#ffcc00"; 
            ctx.lineWidth = 4;
            ctx.stroke();

            const tipoKataSeleccionado = DOM.selectKata.value;
            let posturaCorrectaEnEsteFrame = false;

            // Regla calibrada a 45 grados por orden del Sensei
            if (tipoKataSeleccionado === "zenkutsu") {
                if (anguloRodilla >= 45 && anguloRodilla <= 95) posturaCorrectaEnEsteFrame = true;
            } else if (tipoKataSeleccionado === "kiba") {
                if (anguloRodilla >= 80 && anguloRodilla <= 110) posturaCorrectaEnEsteFrame = true;
            } else if (tipoKataSeleccionado === "kokutsu") {
                if (anguloRodilla >= 90 && anguloRodilla <= 120) posturaCorrectaEnEsteFrame = true;
            }

            const ahora = performance.now();
            const deltaTiempo = (ahora - lastTimestamp) / 1000;
            lastTimestamp = ahora;

            if (posturaCorrectaEnEsteFrame) {
                if (!flagPosturaCorrecta) {
                    flagPosturaCorrecta = true;
                    hablar("Posición correcta, sostenga.");
                }

                conteoEstabilidad += deltaTiempo;
                DOM.displayEstatus.innerText = "Sosteniendo Postura";
                DOM.displayEstatus.style.color = "var(--color-success)";
                DOM.cardTimer.classList.add('en-rojo'); 
                
                if (conteoEstabilidad >= 5.0) {
                    DOM.displayTimer.innerText = "5.0s";
                    hablar("Evaluación aprobada. Excelente posición. ¡Oss!");
                    conteoEstabilidad = 0;
                } else {
                    DOM.displayTimer.innerText = `${conteoEstabilidad.toFixed(1)}s`;
                }
            } else {
                flagPosturaCorrecta = false;
                conteoEstabilidad = 0;
                DOM.displayTimer.innerText = "0.0s";
                DOM.displayEstatus.innerText = "Corrija Posición";
                DOM.displayEstatus.style.color = "var(--color-error)";
                DOM.cardTimer.classList.remove('en-rojo'); 
            }
        }
    </script>
</body>
</html>
