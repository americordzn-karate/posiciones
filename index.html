<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Senshi-Kan Biomecánica</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #161616; padding: 30px; border-radius: 12px; }
        video, canvas { width: 100%; border-radius: 8px; transform: scaleX(-1); }
    </style>
</head>
<body>
<div class="container">
    <div><video id="webcam" autoplay playsinline muted></video><canvas id="output-canvas"></canvas></div>
    <div id="info"><h1>Senshi-Kan</h1><div id="status">Sincronizando...</div></div>
</div>

<script>
    const URL_DEL_PUENTE = "https://script.google.com/macros/s/AKfycbyztkOsUU7xl42gUe-q9uPOQdGpxRJNyuN9RxJdPhVdT12yjeP-kXFReGO1rMw6QygQcg/exec";
    const video = document.getElementById('webcam');
    
    async function inicializar() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);
        
        const res = await fetch(URL_DEL_PUENTE);
        const alumnos = await res.json();
        const descriptores = [];

        for (let al of alumnos) {
            // Se entrena la IA usando el nombre de archivo de la columna J
            const img = await faceapi.fetchImage(`https://docs.google.com/uc?export=view&id=${al.rutaFoto.split('/').pop()}`);
            const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (det) descriptores.push(new faceapi.LabeledFaceDescriptors(`${al.nombre}|${al.estatura}|${al.peso}`, [det.descriptor]));
        }
        
        const matcher = new faceapi.FaceMatcher(descriptores, 0.5);
        document.getElementById("status").innerText = "SISTEMA ACTIVO";
        navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);
        
        setInterval(async () => {
            const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (det) {
                const match = matcher.findBestMatch(det.descriptor);
                if (match.label !== 'unknown') {
                    const [n, e, p] = match.label.split("|");
                    document.getElementById("status").innerHTML = `Alumno: ${n}<br>Estatura: ${e}<br>Peso: ${p}`;
                }
            }
        }, 1000);
    }
    window.onload = inicializar;
</script>
</body>
</html>
