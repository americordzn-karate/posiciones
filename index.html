<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senshi-Kan Karate Pose Evaluator</title>
    <!-- MediaPipe y TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        /* ==========================================
           PALETA DE DISEÑO: NEGRO, BLANCO Y ORO/MOSTAZA
           ========================================== */
        :root {
            --color-bg: #0b0b0b;
            --color-surface: #161616;
            --color-text: #ffffff;
            --color-text-muted: #aaaaaa;
            --color-primary: #e6b800; /* Amarillo Mostaza / Oro */
            --color-error: #ff3333;
            --color-right-node: #e6b800; /* Lado Derecho: Amarillo */
            --color-left-node: #33ccff;  /* Lado Izquierdo: Celeste */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background-color: var(--color-surface);
            width: 100%;
            text-align: center;
            padding: 15px;
            border-bottom: 3px solid var(--color-primary);
        }

        header h1 {
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-primary);
        }

        header p {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Formato móvil vertical */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--color-surface);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #222;
        }

        /* CONFIGURACIÓN E INPUTS */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--color-primary);
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: #222;
            border: 1px solid #44
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--color-primary);
            outline: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        /* BOTONES */
        .btn {
            background-color: var(--color-primary);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #cc00;
            background-color: #cca300;
        }

        /* CONTADORES Y FEEDBACK */
        .dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .timer-master {
            font-size: 1.1rem;
            color: var(--color-text-muted);
        }

        .timer-master span {
            color: #fff;
            font-weight: bold;
        }

        .timer-principal {
            font-size: 3.5rem;
            font-family: monospace;
            font-weight: bold;
            line-height: 1;
            margin: 5px 0;
            transition: color 0.2s;
        }

        .timer-retencion {
            background-color: #222;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1rem;
            border: 1px solid #333;
        }

        .timer-retencion span {
            color: var(--color-primary);
            font-weight: bold;
        }

        .target-pose {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--color-primary);
            margin: 5px 0;
            text-transform: uppercase;
            border: 1px dashed var(--color-primary);
            padding: 8px;
            width: 100%;
            border-radius: 4px;
        }

        .score-live {
            font-size: 1.1rem;
        }

        /* CONTENEDOR DE CÁMARA Y LIENZO */
        .video-box {
            position: relative;
            width: 100%;
            padding-top: 133.33%; /* Relación de aspecto 3:4 vertical */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--color-surface);
        }

        .video-box video, .video-box canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-box canvas {
            z-index: 2;
            pointer-events: none;
        }

        /* PANTALLA DE RESULTADOS */
        .modal-results {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .results-card {
            background-color: var(--color-surface);
            border: 2px solid var(--color-primary);
            border-radius: 8px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(230, 184, 0, 0.2);
        }

        .results-header {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .results-header h2 {
            color: var(--color-primary);
            text-transform: uppercase;
            font-size: 1.5rem;
        }

        .results-header .student-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .score-final {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--color-primary);
            margin: 10px 0;
        }

        .table-results {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .table-results th, .table-results td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }

        .table-results th {
            background-color: #222;
            color: var(--color-primary);
            text-transform: uppercase;
        }

        .status-ok { color: #33cc66; font-weight: bold; }
        .status-fail { color: var(--color-error); font-weight: bold; }

        .slogan {
            text-align: center;
            font-style: italic;
            margin-top: 20px;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Senshi-Kan Kinematic Analyzer</h1>
        <p>Evaluador de Posturas Automatizado · "Vence Tus Límites"</p>
    </header>

    <div class="container">
        <!-- Panel de Configuración Inicial -->
        <div class="card" id="setup-panel">
            <div class="form-group">
                <label for="input-name">Nombre del Alumno</label>
                <input type="text" id="input-name" placeholder="Ej. Fernanda Rodríguez" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="input-height">Estatura (cm)</label>
                    <input type="number" id="input-height" value="170" required>
                </div>
                <div class="form-group">
                    <label for="select-guard">Guardia Inicial</label>
                    <select id="select-guard">
                        <option value="izquierdo" selected>Izquierda al Frente</option>
                        <option value="derecho">Derecha al Frente</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="select-camera">Cámara</label>
                <select id="select-camera">
                    <option value="user" selected>Frontal (Selfie)</option>
                    <option value="environment">Trasera (Principal)</option>
                </select>
            </div>
            <button class="btn" id="btn-start">Iniciar Evaluación</button>
        </div>

        <!-- Panel de Ejecución del Test -->
        <div class="card" id="test-panel" style="display: none;">
            <div class="dashboard">
                <div class="timer-master">Tiempo Maestro: <span id="txt-master">02:00</span></div>
                <div class="target-pose" id="txt-target">PREPARANDO...</div>
                <div class="timer-principal" id="txt-principal">20.00</div>
                <div class="timer-retencion">Estabilidad: <span id="txt-retencion">0.0s</span> / 5s</div>
                <div class="score-live">Posiciones logradas: <strong id="txt-score" style="color: var(--color-primary);">0</strong></div>
            </div>
        </div>

        <!-- Recuadro del Video -->
        <div class="video-box" id="video-container" style="display: none;">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output-canvas"></canvas>
        </div>
    </div>

    <!-- Modal de Resultados Finales -->
    <div class="modal-results" id="modal-results">
        <div class="results-card">
            <div class="results-header">
                <h2>Evaluación Finalizada</h2>
                <div class="student-name" id="res-student">---</div>
                <p id="res-date"></p>
            </div>
            <p style="text-align: center; text-transform: uppercase; font-size: 0.8rem; color: var(--color-text-muted);">Score Obtenido</p>
            <div class="score-final" id="res-score">0</div>
            
            <table class="table-results">
                <thead>
                    <tr>
                        <th>Posición Evaluada</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="res-table-body">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>

            <div class="slogan">SENSHI-KAN KARATE ACADEMY<br>"VENCE TUS LÍMITES"</div>
            <button class="btn" style="margin-top: 20px;" onclick="window.location.reload();">Reiniciar</button>
        </div>
    </div>

    <!-- CONTEXTO TÉCNICO, CONFIGURACIÓN CENTRALIZADA Y LÓGICA BIOMECÁNICA -->
    <script>
        // =========================================================================
        // 1. SECCIÓN DE CONFIGURACIÓN CENTRALIZADA (Config Object)
        // =========================================================================
        const CONFIG = {
            TIEMPO_MAESTRO_TOTAL: 120,    // Duración total de la prueba en segundos (2 minutos)
            TIEMPO_VENTANA_POSTURA: 20,   // Ventana de tiempo para armar cada posición (segundos)
            TIEMPO_RETENCION_REQUERIDO: 5, // Segundos continuos que debe mantener la postura
            TOLERANCIA_PORCENTAJE: 0.05,  // +-5% de tolerancia cinemática
            UMBRAL_DETECCION_GOLPE: 45,   // Umbral de activación técnica aprendido previamente

            // Datos antropométricos exactos del Sujeto de Prueba proporcionados por el Sensei
            SUJETO_PRUEBA: {
                ESTATURA: 174,
                TALON_A_CADERA: 100,
                TALON_A_RODILLA: 50,
                TALON_A_PUNTA: 25,
                ANCHO_CADERAS: 36
            }
        };

        // =========================================================================
        // 2. VARIABLES DE ESTADO DEL SOFTWARE
        // =========================================================================
        let estadoApp = {
            nombreAlumno: "",
            estaturaAlumno: 170,
            guardia: "izquierdo", // izquierdo o derecho al frente
            camaraSeleccionada: "user",
            
            // Timers y contadores
            tiempoMaestroRestante: CONFIG.TIEMPO_MAESTRO_TOTAL,
            tiempoPrincipalRestante: CONFIG.TIEMPO_VENTANA_POSTURA,
            tiempoRetencionAcumulado: 0,
            score: 0,
            
            // Gestión de la secuencia
            posicionActual: null,
            historialResultados: [], // Guarda { nombre, logrado: true/false }
            catalogoLocal: [],
            
            // Control de banderas (Flags)
            pruebaActiva: false,
            posturaConectada: false,
            
            // Referencias de intervalos
            intervaloMaestro: null,
            intervaloLógica: null
        };

        // Contexto de Audio Web API para Beeps y Buzzers nativos
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function sonarBeep() {
            let osc = AudioCtx.createOscillator();
            let gain = AudioCtx.createGain();
            osc.connect(gain); gain.connect(AudioCtx.destination);
            osc.frequency.value = 880; // Tono agudo limpio
            gain.gain.setValueAtTime(0.1, AudioCtx.currentTime);
            osc.start(); osc.stop(AudioCtx.currentTime + 0.15);
        }

        function sonarBuzzer() {
            let osc = AudioCtx.createOscillator();
            let gain = AudioCtx.createGain();
            osc.connect(gain); gain.connect(AudioCtx.destination);
            osc.type = 'sawtooth'; // Sonido raspado de error
            osc.frequency.value = 150; 
            gain.gain.setValueAtTime(0.1, AudioCtx.currentTime);
            osc.start(); osc.stop(AudioCtx.currentTime + 0.3);
        }

        function hablar(mensaje) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Detener cualquier comando de voz previo
                let utterance = new SpeechSynthesisUtterance(mensaje);
                utterance.lang = 'es-MX';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // =========================================================================
        // 3. CATÁLOGO METODOLÓGICO DE POSICIONES
        // =========================================================================
        const CATALOGO_POSICIONES = [
            {
                id: "HeisokuDachi",
                nombre: "Heisoku Dachi",
                evaluar: (nodos, factorEscala) => {
                    // Ambos pies juntos paralelos internos unidos
                    let distTalones = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let maxDistTalones = (CONFIG.SUJETO_PRUEBA.TALON_A_PUNTA * 0.4) * factorEscala; // Muy pegados
                    let extRodillaIzq = calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle);
                    let extRodillaDer = calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle);
                    
                    return (distTalones <= maxDistTalones && extRodillaIzq >= 165 && extRodillaDer >= 165);
                }
            },
            {
                id: "MusubiDachi",
                nombre: "Musubi Dachi",
                evaluar: (nodos, factorEscala) => {
                    let distTalones = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let maxDistTalones = (CONFIG.SUJETO_PRUEBA.TALON_A_PUNTA * 0.5) * factorEscala;
                    // Ángulo entre pies ~45 grados totales
                    let anguloPies = calcularAnguloEntreVectores(nodos.left_ankle, nodos.left_foot, nodos.right_ankle, nodos.right_foot);
                    return (distTalones <= maxDistTalones && verificarRango(anguloPies, 45, 12));
                }
            },
            {
                id: "HeikoDachi",
                nombre: "Heiko Dachi",
                evaluar: (nodos, factorEscala) => {
                    let distTalones = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let distCaderasEsperada = CONFIG.SUJETO_PRUEBA.ANCHO_CADERAS * factorEscala;
                    // Pies paralelos apuntando al frente
                    let anguloIzq = Math.abs(nodos.left_foot.x - nodos.left_ankle.x);
                    return (verificarRango(distTalones, distCaderasEsperada, distCaderasEsperada * CONFIG.TOLERANCIA_PORCENTAJE) && anguloIzq < 0.05);
                }
            },
            {
                id: "HachiyiDachi",
                nombre: "Hachiji Dachi",
                evaluar: (nodos, factorEscala) => {
                    let distTalones = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let distCaderasEsperada = CONFIG.SUJETO_PRUEBA.ANCHO_CADERAS * factorEscala;
                    let anguloPies = calcularAnguloEntreVectores(nodos.left_ankle, nodos.left_foot, nodos.right_ankle, nodos.right_foot);
                    return (verificarRango(distTalones, distCaderasEsperada, distCaderasEsperada * CONFIG.TOLERANCIA_PORCENTAJE) && verificarRango(anguloPies, 45, 12));
                }
            },
            {
                id: "NaifanchinDachi",
                nombre: "Naifanchin Dachi",
                evaluar: (nodos, factorEscala) => {
                    let anguloPies = calcularAnguloEntreVectores(nodos.left_ankle, nodos.left_foot, nodos.right_ankle, nodos.right_foot);
                    let rodillaIzq = calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle);
                    let rodillaDer = calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle);
                    
                    let distCaderas = calcularDistancia2D(nodos.left_hip, nodos.right_hip);
                    let distRodillas = calcularDistancia2D(nodos.left_knee, nodos.right_knee);
                    let relacionRodillaEspera = distCaderas * 0.8; // Reducción del 20%
                    
                    // Flexión ligera 20° equivale a 160° internos
                    return (verificarRango(rodillaIzq, 160, 8) && verificarRango(rodillaDer, 160, 8) && distRodillas <= relacionRodillaEspera);
                }
            },
            {
                id: "ShikoDachi",
                nombre: "Shiko Dachi",
                evaluar: (nodos, factorEscala) => {
                    let distTalones = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let distEsperada = 90 * factorEscala; // Base 90 cm escalados
                    
                    let rodillaIzq = calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle);
                    let rodillaDer = calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle);
                    
                    return (verificarRango(distTalones, distEsperada, distEsperada * CONFIG.TOLERANCIA_PORCENTAJE) &&
                            verificarRango(rodillaIzq, 125, 125 * CONFIG.TOLERANCIA_PORCENTAJE) && 
                            verificarRango(rodillaDer, 125, 125 * CONFIG.TOLERANCIA_PORCENTAJE));
                }
            },
            {
                id: "MotoDachi",
                nombre: "Moto Dachi",
                evaluar: (nodos, factorEscala) => {
                    let esIzq = (estadoApp.guardia === "izquierdo");
                    let nDelantero = esIzq ? nodos.left_knee : nodos.right_knee;
                    let tDelantero = esIzq ? nodos.left_ankle : nodos.right_ankle;
                    let rTrasera = esIzq ? calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle) : calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle);
                    let rDelantera = esIzq ? calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle) : calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle);
                    
                    let distPies = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let distEsperada = 60 * factorEscala;
                    
                    // Rodilla delantera alineada verticalmente con su talón (coordenada X similar)
                    let alineacionVertical = Math.abs(nDelantero.x - tDelantero.x) < 0.08;
                    
                    return (verificarRango(distPies, distEsperada, distEsperada * CONFIG.TOLERANCIA_PORCENTAJE) &&
                            verificarRango(rDelantera, 130, 130 * CONFIG.TOLERANCIA_PORCENTAJE) &&
                            rTrasera >= 170 && alineacionVertical);
                }
            },
            {
                id: "ZenkutsuDachi",
                nombre: "Zenkutsu Dachi",
                evaluar: (nodos, factorEscala) => {
                    let esIzq = (estadoApp.guardia === "izquierdo");
                    let nDelantero = esIzq ? nodos.left_knee : nodos.right_knee;
                    let tDelantero = esIzq ? nodos.left_ankle : nodos.right_ankle;
                    let rTrasera = esIzq ? calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle) : calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle);
                    let rDelantera = esIzq ? calcularAngulo(nodos.left_hip, nodos.left_knee, nodos.left_ankle) : calcularAngulo(nodos.right_hip, nodos.right_knee, nodos.right_ankle);
                    
                    let distPies = calcularDistancia2D(nodos.left_ankle, nodos.right_ankle);
                    let distEsperada = 85 * factorEscala;
                    
                    let alineacionVertical = Math.abs(nDelantero.x - tDelantero.x) < 0.08;
                    
                    return (verificarRango(distPies, distEsperada, distEsperada * CONFIG.TOLERANCIA_PORCENTAJE) &&
                            verificarRango(rDelantera, 110, 110 * CONFIG.TOLERANCIA_PORCENTAJE) &&
                            rTrasera >= 170 && alineacionVertical);
                }
            }
        ];

        // =========================================================================
        // 4. AUXILIARES MATEMÁTICOS BIOMECÁNICOS
        // =========================================================================
        function calcularDistancia2D(p1, p2) {
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        function calcularAngulo(pA, pB, pC) {
            let ab = { x: pA.x - pB.x, y: pA.y - pB.y };
            let cb = { x: pC.x - pB.x, y: pC.y - pB.y };
            let dotProduct = ab.x * cb.x + ab.y * cb.y;
            let normAB = Math.sqrt(ab.x * ab.x + ab.y * ab.y);
            let normCB = Math.sqrt(cb.x * cb.x + cb.y * cb.y);
            let angle = Math.acos(dotProduct / (normAB * normCB));
            return angle * (180 / Math.PI);
        }

        function calcularAnguloEntreVectores(p1A, p1B, p2A, p2B) {
            let v1 = { x: p1B.x - p1A.x, y: p1B.y - p1A.y };
            let v2 = { x: p2B.x - p2A.x, y: p2B.y - p2A.y };
            let dot = v1.x * v2.x + v1.y * v2.y;
            let n1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            let n2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
            return Math.acos(dot / (n1 * n2)) * (180 / Math.PI);
        }

        function verificarRango(valor, objetivo, tolerancia) {
            return valor >= (objetivo - tolerancia) && valor <= (objetivo + tolerancia);
        }

        // =========================================================================
        // 5. CONTROLADORES DE EVENTOS DE INTERFAZ Y FLUJO (TIMERS)
        // =========================================================================
        const DOM = {
            btnStart: document.getElementById('btn-start'),
            setupPanel: document.getElementById('setup-panel'),
            testPanel: document.getElementById('test-panel'),
            videoContainer: document.getElementById('video-container'),
            txtMaster: document.getElementById('txt-master'),
            txtTarget: document.getElementById('txt-target'),
            txtPrincipal: document.getElementById('txt-principal'),
            txtRetencion: document.getElementById('txt-retencion'),
            txtScore: document.getElementById('txt-score'),
            modalResults: document.getElementById('modal-results'),
            resStudent: document.getElementById('res-student'),
            resDate: document.getElementById('res-date'),
            resScore: document.getElementById('res-score'),
            resTableBody: document.getElementById('res-table-body'),
            video: document.getElementById('webcam'),
            canvas: document.getElementById('output-canvas')
        };

        DOM.btnStart.addEventListener('click', iniciarEntrenamiento);

        function iniciarEntrenamiento() {
            estadoApp.nombreAlumno = document.getElementById('input-name').value.trim() || "Alumno Anónimo";
            estadoApp.estaturaAlumno = parseFloat(document.getElementById('input-height').value) || 170;
            estadoApp.guardia = document.getElementById('select-guard').value;
            estadoApp.camaraSeleccionada = document.getElementById('select-camera').value;

            DOM.setupPanel.style.display = 'none';
            DOM.testPanel.style.display = 'block';
            DOM.videoContainer.style.display = 'block';

            estadoApp.catalogoLocal = [...CATALOGO_POSICIONES];
            estadoApp.pruebaActiva = true;

            siguientePosicion();
            encenderMotoresTimers();
            setupCamera();
        }

        function encenderMotoresTimers() {
            // Reloj Maestro de 2 Minutos (Ininterrumpido)
            estadoApp.intervaloMaestro = setInterval(() => {
                estadoApp.tiempoMaestroRestante--;
                
                let min = Math.floor(estadoApp.tiempoMaestroRestante / 60);
                let seg = estadoApp.tiempoMaestroRestante % 60;
                DOM.txtMaster.innerText = `${min.toString().padStart(2, '0')}:${seg.toString().padStart(2, '0')}`;

                if (estadoApp.tiempoMaestroRestante <= 0) {
                    finalizarPruebaGlobal();
                }
            }, 1000);

            // Reloj Principal (20s y Retención 5s) ejecutándose a centésimas
            let ultimoTiempo = performance.now();
            function bucleTimers(ahora) {
                if (!estadoApp.pruebaActiva) return;
                let delta = (ahora - ultimoTiempo) / 1000;
                ultimoTiempo = ahora;

                if (!estadoApp.posturaConectada) {
                    // Estado 1: Buscando postura (corre timer principal descendentemente)
                    estadoApp.tiempoPrincipalRestante -= delta;
                    if (estadoApp.tiempoPrincipalRestante < 0) estadoApp.tiempoPrincipalRestante = 0;

                    DOM.txtPrincipal.innerText = estadoApp.tiempoPrincipalRestante.toFixed(2);
                    
                    // Feedback visual por tiempo crítico
                    if (estadoApp.tiempoPrincipalRestante <= 5) {
                        DOM.txtPrincipal.style.color = CONFIG.color_error;
                    } else {
                        DOM.txtPrincipal.style.color = CONFIG.color_primary;
                    }

                    if (estadoApp.tiempoPrincipalRestante <= 0) {
                        sonarBuzzer();
                        hablar("Prueba no superada");
                        estadoApp.historialResultados.push({ nombre: estadoApp.posicionActual.nombre, logrado: false });
                        siguientePosicion();
                    }
                } else {
                    // Estado 2: Postura conectada (se congela principal, corre retención)
                    estadoApp.tiempoRetencionAcumulado += delta;
                    DOM.txtRetencion.innerText = estadoApp.tiempoRetencionAcumulado.toFixed(1) + "s";

                    if (estadoApp.tiempoRetencionAcumulado >= CONFIG.TIEMPO_RETENCION_REQUERIDO) {
                        sonarBeep();
                        hablar("Logrado");
                        estadoApp.score++;
                        DOM.txtScore.innerText = estadoApp.score;
                        estadoApp.historialResultados.push({ nombre: estadoApp.posicionActual.nombre, logrado: true });
                        siguientePosicion();
                    }
                }
                requestAnimationFrame(bucleTimers);
            }
            requestAnimationFrame(bucleTimers);
        }

        function siguientePosicion() {
            if (estadoApp.catalogoLocal.length === 0) {
                // Si agota las 8 posiciones antes de los 2 minutos, vuelve a rellenar el pool para modo infinito por tiempo
                estadoApp.catalogoLocal = [...CATALOGO_POSICIONES];
            }

            let indiceAleatorio = Math.floor(Math.random() * estadoApp.catalogoLocal.length);
            estadoApp.posicionActual = estadoApp.catalogoLocal.splice(indiceAleatorio, 1)[0];
            
            estadoApp.tiempoPrincipalRestante = CONFIG.TIEMPO_VENTANA_POSTURA;
            estadoApp.tiempoRetencionAcumulado = 0;
            estadoApp.posturaConectada = false;

            DOM.txtTarget.innerText = estadoApp.posicionActual.nombre;
            DOM.txtRetencion.innerText = "0.0s";

            hablar(`Ahora haz ${estadoApp.posicionActual.nombre}`);
        }

        function finalizarPruebaGlobal() {
            estadoApp.pruebaActiva = false;
            clearInterval(estadoApp.intervaloMaestro);
            
            // Apagar cámara web de forma segura
            if (DOM.video.srcObject) {
                DOM.video.srcObject.getTracks().forEach(track => track.stop());
            }

            // Renderizar Modal de Resultados
            DOM.resStudent.innerText = estadoApp.nombreAlumno;
            DOM.resDate.innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            DOM.resScore.innerText = estadoApp.score;

            DOM.resTableBody.innerHTML = "";
            estadoApp.historialResultados.forEach(res => {
                let fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${res.nombre}</td>
                    <td class="${res.logrado ? 'status-ok' : 'status-fail'}">${res.logrado ? 'LOGRADA (+1)' : 'NO LOGRADA'}</td>
                `;
                DOM.resTableBody.appendChild(fila);
            });

            DOM.modalResults.style.display = 'flex';
        }

        // =========================================================================
        // 6. MOTOR DE VISIÓN COMPUTACIONAL (MediaPipe & Canvas Drawing)
        // =========================================================================
        let detector;
        let ctx = DOM.canvas.getContext('2d');

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: estadoApp.camaraSeleccionada, width: 640, height: 480 },
                audio: false
            });
            DOM.video.srcObject = stream;
            
            DOM.video.onloadedmetadata = () => {
                DOM.canvas.width = DOM.video.videoWidth;
                DOM.canvas.height = DOM.video.videoHeight;
                inicializarPoseDetection();
            };
        }

        async function inicializarPoseDetection() {
            const model = poseDetection.SupportedModels.BlazePose;
            const detectorConfig = {
                runtime: 'mediapipe',
                solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/pose',
                modelType: 'full'
            };
            detector = await poseDetection.createDetector(model, detectorConfig);
            detectarFrame();
        }

        async function detectarFrame() {
            if (!estadoApp.pruebaActiva) return;

            const poses = await detector.estimatePoses(DOM.video, { flipHorizontal: (estadoApp.camaraSeleccionada === "user") });
            
            ctx.clearRect(0, 0, DOM.canvas.width, DOM.canvas.height);
            // Dibujamos el cuadro de video de fondo de forma limpia
            ctx.drawImage(DOM.video, 0, 0, DOM.canvas.width, DOM.canvas.height);

            if (poses.length > 0) {
                const keypoints = poses[0].keypoints;
                
                // Mapeo estructurado de nodos requeridos del tren inferior
                const nodos = {
                    left_hip: keypoints.find(k => k.name === 'left_hip'),
                    right_hip: keypoints.find(k => k.name === 'right_hip'),
                    left_knee: keypoints.find(k => k.name === 'left_knee'),
                    right_knee: keypoints.find(k => k.name === 'right_knee'),
                    left_ankle: keypoints.find(k => k.name === 'left_ankle'),
                    right_ankle: keypoints.find(k => k.name === 'right_ankle'),
                    left_foot: keypoints.find(k => k.name === 'left_foot_index'),
                    right_foot: keypoints.find(k => k.name === 'right_foot_index')
                };

                // Validamos que los nodos críticos tengan suficiente confianza de detección
                const umbralConfianza = 0.5;
                let todosVisibles = Object.values(nodos).every(n => n && n.score > umbralConfianza);

                if (todosVisibles) {
                    // Render de nodos únicamente (Sin líneas estructurales)
                    dibujarNodo(ctx, nodos.right_hip, CONFIG.color_right_node);
                    dibujarNodo(ctx, nodos.right_knee, CONFIG.color_right_node);
                    dibujarNodo(ctx, nodos.right_ankle, CONFIG.color_right_node);
                    dibujarNodo(ctx, nodos.right_foot, CONFIG.color_right_node);

                    dibujarNodo(ctx, nodos.left_hip, CONFIG.color_left_node);
                    dibujarNodo(ctx, nodos.left_knee, CONFIG.color_left_node);
                    dibujarNodo(ctx, nodos.left_ankle, CONFIG.color_left_node);
                    dibujarNodo(ctx, nodos.left_foot, CONFIG.color_left_node);

                    // Factor dinámico de escala basado en pixeles vs la estatura real del alumno
                    let pxEstaturaEnPantalla = calcularDistancia2D(nodos.left_hip, nodos.left_ankle); 
                    let factorEscala = pxEstaturaEnPantalla / CONFIG.SUJETO_PRUEBA.TALON_A_CADERA;

                    // EVALUACIÓN BIOMECÁNICA EN TIEMPO REAL
                    let cumplePostura = estadoApp.posicionActual.evaluar(nodos, factorEscala);

                    if (cumplePostura && !estadoApp.posturaConectada) {
                        // Conexión exitosa inicial
                        estadoApp.posturaConectada = true;
                        sonarBeep();
                    } else if (!cumplePostura && estadoApp.posturaConectada) {
                        // Desconexión prematura de la postura
                        estadoApp.posturaConectada = false;
                        estadoApp.tiempoRetencionAcumulado = 0;
                        sonarBuzzer();
                    }
                }
            }

            requestAnimationFrame(detectarFrame);
        }

        function dibujarNodo(canvasCtx, nodo, color) {
            canvasCtx.beginPath();
            canvasCtx.arc(nodo.x, nodo.y, 8, 0, 2 * Math.PI);
            canvasCtx.fillStyle = color;
            canvasCtx.fill();
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#ffffff';
            canvasCtx.stroke();
        }
    </script>
</body>
