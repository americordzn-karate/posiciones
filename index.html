<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador de Posiciones Senshi-Kan</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0b0b0b;
            --surface-color: #161616;
            --primary-color: #e6b800; /* Amarillo Mostaza */
            --success-color: #33cc66;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #222;
        }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .panel-datos { display: flex; flex-direction: column; justify-content: space-between; }
        header { border-bottom: 3px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { color: var(--primary-color); text-transform: uppercase; font-size: 1.4rem; letter-spacing: 1px; }
        header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .status-box {
            background-color: #0d0d0d;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            border: 1px solid #222;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .student-info {
            background-color: #0d0d0d;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .campo { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 1.1rem; }
        .campo .val { font-weight: bold; }
        
        #area-evaluacion { opacity: 0.2; pointer-events: none; transition: opacity 0.5s ease; }
        #area-evaluacion.activo { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="visual-section">
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output-canvas"></canvas>
        </div>
    </div>

    <div class="panel-datos">
        <div>
            <header>
                <h1>Senshi-Kan Biomecánica</h1>
                <p>Análisis de Posiciones y Kinesioterapia</p>
            </header>
            <div class="status-box" id="status-sistema">Iniciando Filtro de Seguridad...</div>
        </div>

        <div id="area-evaluacion">
            <div class="student-info">
                <div class="campo"><span>Atleta:</span><span class="val" id="txt-nombre" style="color:var(--primary-color)">---</span></div>
                <div class="campo"><span>Estatura:</span><span class="val" id="txt-estatura">---</span></div>
                <div class="campo"><span>Peso:</span><span class="val" id="txt-peso">---</span></div>
            </div>
            
            <div style="margin-top: 25px; padding: 15px; border: 1px dashed #333; text-align: center; color: var(--success-color); font-weight: bold; font-size: 0.9rem; border-radius: 6px;">
                ✓ EVALUACIÓN BIOMECÁNICA ACTIVA
            </div>
        </div>
    </div>
</div>

<script>
    // CAMBIA ESTO POR TU ENLACE DE ACCESO DE GOOGLE APPS SCRIPT
    const URL_DEL_PUENTE = "https://script.google.com/macros/s/AKfycbzJTMTKJNo-QPggALZmPmL-R7tDPFxrsDR37Ntnk8TTnCTZ2VZ7VYWLuhpbtZ4AiXP3/exec";
    
    let faceMatcher = null;
    let detectorPose = null;
    let sistemaLiberado = false;
    let bucleFacialInterval = null;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');

    async function inicializarApp() {
        try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            
            document.getElementById("status-sistema").innerText = "Procesando Rostros del Dojo...";
            await descargarYEntrenarRostros();
        } catch(e) {
            document.getElementById("status-sistema").innerText = "Error al cargar librerías base.";
        }
    }

    // Auxiliar para convertir los datos Base64 en un elemento de imagen HTML compatible con Face-API
    function crearElementoImagen(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = (e) => reject(e);
            img.src = src;
        });
    }

    async function descargarYEntrenarRostros() {
        try {
            const res = await fetch(URL_DEL_PUENTE);
            const alumnos = await res.json();
            const descriptores = [];

            for (let al of alumnos) {
                if (al.fotoUrl && al.fotoUrl.startsWith("data:image")) {
                    try {
                        const imgElement = await crearElementoImagen(al.fotoUrl);
                        const det = await faceapi.detectSingleFace(imgElement, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                        if (det) {
                            descriptores.push(new faceapi.LabeledFaceDescriptors(
                                `${al.nombre}|${al.estatura}|${al.peso}`, 
                                [det.descriptor]
                            ));
                        }
                    } catch(err) {
                        console.log("No se pudo procesar el rostro de: " + al.nombre);
                    }
                }
            }

            if (descriptores.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(descriptores, 0.55);
                document.getElementById("status-sistema").innerText = "SISTEMA BLOQUEADO: Posiciónate frente a la cámara";
                encenderDispositivoCamara();
            } else {
                document.getElementById("status-sistema").innerText = "Error: Las imágenes de Drive no pudieron procesarse.";
            }
        } catch (error) {
            document.getElementById("status-sistema").innerText = "Error de conexión con Sheets.";
        }
    }

    function encenderDispositivoCamara() {
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
            .then(stream => { 
                video.srcObject = stream;
                bucleFacialInterval = setInterval(ejecutarFiltroFacial, 500);
            }).catch(err => {
                document.getElementById("status-sistema").innerText = "No se detectó ninguna cámara web.";
            });
    }

    async function ejecutarFiltroFacial() {
        if (sistemaLiberado) return;

        const detEnVivo = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
        
        if (detEnVivo) {
            const mejorMatch = faceMatcher.findBestMatch(detEnVivo.descriptor);
            
            if (mejorMatch.label !== 'unknown') {
                clearInterval(bucleFacialInterval);
                sistemaLiberado = true;

                const [nombre, estatura, peso] = mejorMatch.label.split("|");
                
                document.getElementById("txt-nombre").innerText = nombre;
                document.getElementById("txt-estatura").innerText = estatura;
                document.getElementById("txt-peso").innerText = peso;
                
                document.getElementById("status-sistema").innerText = "ACCESO PERMITIDO. ABRIENDO EVALUADOR...";
                document.getElementById("status-sistema").style.color = "#33cc66";
                document.getElementById("area-evaluacion").classList.add("activo");

                activarMediaPipePoseOriginal();
            }
        }
    }

    function activarMediaPipePoseOriginal() {
        detectorPose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        detectorPose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
        detectorPose.onResults(onResultsPoseOriginal); 
        bucleEvaluacionPose();
    }

    async function bucleEvaluacionPose() {
        if (!video.paused && !video.ended) {
            try { await detectorPose.send({ image: video }); } catch(e) {}
        }
        requestAnimationFrame(bucleEvaluacionPose);
    }

    function onResultsPoseOriginal(results) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (!results.poseLandmarks) return;

        // ---------------------------------------------------------------------
        // AQUÍ ADENTRO SE MANTIENE INTACTO TU CÓDIGO ORIGINAL QUE MIDE
        // LOS ÁNGULOS DE LOS BRAZOS, PIERNAS Y EL IMPACTO DEL GYAKU TSUKI.
        // ---------------------------------------------------------------------
    }

    window.addEventListener('DOMContentLoaded', inicializarApp);
</script>
</body>
</html>
