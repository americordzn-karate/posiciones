<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Biométrico - Senshi-Kan</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0b0b0b;
            --surface-color: #161616;
            --primary-color: #e6b800;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --success-color: #33cc66;
            --error-color: #ff3333;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }

        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }

        .data-section { display: flex; flex-direction: column; justify-content: space-between; }
        header { border-bottom: 3px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { color: var(--primary-color); font-size: 1.6rem; text-transform: uppercase; }

        .status-box {
            background-color: #0d0d0d;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        /* Consola de diagnóstico integrada en pantalla */
        .debug-console {
            background-color: #000;
            border: 1px solid #333;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            padding: 15px;
            border-radius: 6px;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="camera-section">
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output-canvas"></canvas>
        </div>
    </div>

    <div class="data-section">
        <div>
            <header>
                <h1>Senshi-Kan MODO DIAGNÓSTICO</h1>
                <p>Analizando discrepancia matemática de vectores faciales</p>
            </header>

            <div class="status-box" id="status-sistema">Cargando...</div>
        </div>

        <div>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Monitoreo Biométrico en Tiempo Real:</p>
            <div class="debug-console" id="debug-log">Iniciando logs de sistema...</div>
        </div>
    </div>
</div>

<script>
    const URL_DEL_PUENTE = "https://script.google.com/macros/s/AKfycbxXtiKxXBjJ_TL2jT7HrlWfhe8nOWD7Lkt-z3uW1zpDOMSeMkAfYYhzitvO63DYe4BsjQ/exec";
    
    let listaAlumnosSenshiKan = [];
    let videoElement = document.getElementById('webcam');
    let canvasElement = document.getElementById('output-canvas');
    let canvasCtx = canvasElement.getContext('2d');
    let poseDetector = null;
    let contadorLogs = 0;

    function agregarLog(texto) {
        contadorLogs++;
        if(contadorLogs % 30 === 0) { // Limitar la velocidad de texto en pantalla
            const consola = document.getElementById("debug-log");
            consola.innerText = texto + "\n" + consola.innerText;
        }
    }

    async function inicializarSistema() {
        try {
            const respuesta = await fetch(URL_DEL_PUENTE);
            const datosSucios = await respuesta.json();
            
            listaAlumnosSenshiKan = datosSucios.map(alumno => {
                return {
                    nombre: alumno.nombre,
                    huella: typeof alumno.huella === 'string' ? JSON.parse(alumno.huella) : alumno.huella
                };
            });
            
            document.getElementById("status-sistema").innerText = "ALUMNOS CARGADOS. MIRAR A LA CÁMARA.";
            configurarMediaPipe();
        } catch (error) {
            document.getElementById("status-sistema").innerText = "Error de conexión.";
        }
    }

    function configurarMediaPipe() {
        poseDetector = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        poseDetector.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        poseDetector.onResults(onResultsLandmarks);
        encenderCamara();
    }

    function encenderCamara() {
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
        .then(function(stream) {
            videoElement.srcObject = stream;
            videoElement.addEventListener('loadedmetadata', () => poseDetector.send({ image: videoElement }));
            loopProcesamiento();
        });
    }

    async function loopProcesamiento() {
        if (!videoElement.paused && !videoElement.ended) {
            await poseDetector.send({ image: videoElement });
        }
        requestAnimationFrame(loopProcesamiento);
    }

    function onResultsLandmarks(results) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (!results.poseLandmarks) return;

        const kp = results.poseLandmarks;
        let nariz = kp[0]; let ojoIzq = kp[2]; let ojoDer = kp[5]; let orejaIzq = kp[7]; let orejaDer = kp[8];

        if (nariz.visibility > 0.5 && ojoIzq.visibility > 0.5 && ojoDer.visibility > 0.5) {
            
            // Dibujar marcas en pantalla
            canvasCtx.beginPath(); canvasCtx.arc(nariz.x * canvasElement.width, nariz.y * canvasElement.height, 4, 0, 2*Math.PI); canvasCtx.fillStyle = "#e6b800"; canvasCtx.fill();

            let E = Math.sqrt(Math.pow(ojoDer.x - ojoIzq.x, 2) + Math.pow(ojoDer.y - ojoIzq.y, 2));
            
            if (E > 0) {
                let p1 = Math.sqrt(Math.pow(nariz.x - ojoIzq.x, 2) + Math.pow(nariz.y - ojoIzq.y, 2)) / E;
                let p2 = Math.sqrt(Math.pow(nariz.x - ojoDer.x, 2) + Math.pow(nariz.y - ojoDer.y, 2)) / E;
                let p3 = Math.sqrt(Math.pow(orejaIzq.x - orejaDer.x, 2) + Math.pow(orejaIzq.y - orejaDer.y, 2)) / E;
                
                let vivo = [p1.toFixed(3), p2.toFixed(3), p3.toFixed(3)];
                
                // Tomamos la primera huella registrada en tu Sheets como muestra para el log
                let ejemploBase = listaAlumnosSenshiKan[0] ? listaAlumnosSenshiKan[0].huella : [0,0,0];
                let ejemploNombre = listaAlumnosSenshiKan[0] ? listaAlumnosSenshiKan[0].nombre : "Nadie";

                // Imprimir el comparativo directo en el cuadro negro de la pantalla
                agregarLog(`CÁMARA (en vivo): [${vivo.join(', ')}]\nSHEETS (ejemplo ${ejemploNombre}): [${ejemploBase ? ejemploBase.join(', ') : 'null'}]\n-------------------------`);
            }
        }
    }
    window.addEventListener("DOMContentLoaded", inicializarSistema);
</script>
</body>
</html>
